<template id="carousel-tpl">

    </div>
    <button class="carousel__arrow carousel__arrow--prev" aria-label="Previous screen"><img src="assets/icon-prev.svg" alt=""></button>
    <button class="carousel__arrow carousel__arrow--next" aria-label="Next screen"><img src="assets/icon-next.svg" alt=""></button>
    <div class="carousel__dots">
      <button aria-label="Screen 1"></button><button aria-label="Screen 2"></button><button aria-label="Screen 3"></button><button aria-label="Screen 4"></button><button aria-label="Screen 5"></button>
    </div>
  </div>
</template>
    <h1 class="h-page h-page--sm">UI Showcase</h1>

        <video data-video muted loop playsinline preload="metadata" poster="assets/ui/that-socks-poster.webp?v=202611192338" width="1200" height="803" aria-label="Screen recording of the That Socks! e-commerce website">

        <video data-video muted loop playsinline preload="metadata" poster="assets/ui/motion-poster.webp?v=202611192338" width="1200" height="668" aria-label="NEURA headphone product carousel animation">
          <source src="assets/video/motion-carousel.mp4?v=202611192338" type="video/mp4">
